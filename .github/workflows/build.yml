name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements.txt
      - name: Tests (no ROM needed)
        run: python -m unittest discover -s tests -t . -v
      - name: dist/ matches a fresh build
        run: python -m tools.check_dist

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements.txt
      - name: Package dist/ with checksums
        run: python -m tools.package_release "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" \
            --notes "Built from ${GITHUB_SHA}. Checksums in SHA256SUMS. MIT licensed; see LICENSE."
